services:
  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_ORIGINS: ${SITE_URL}
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      SITE_NAME: ${SITE_NAME:-Nurdivle}
      SITE_URL: ${SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-noreply@nurdivle.com}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Nurdivle}
    healthcheck:
      interval: 15s
      retries: 5
      start_period: 30s
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      timeout: 5s
    ports:
      - '3000:3000'
    restart: unless-stopped
    volumes:
      - portfolio_media:/app/media

  postgres:
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: portfolio
    healthcheck:
      interval: 5s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      timeout: 5s
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data

volumes:
  portfolio_media:
  portfolio_postgres_data:

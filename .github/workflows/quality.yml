name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        env:
          POSTGRES_DB: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_USER: portfolio
        image: postgres:16-alpine
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:5432/portfolio
      PAYLOAD_SECRET: ci-only-payload-secret-at-least-thirty-two-characters
      SITE_NAME: Developer Portfolio
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:types
      - run: pnpm check:lines
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm migrate
      - run: pnpm seed
      - run: pnpm test:int
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
